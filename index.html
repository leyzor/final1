<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leyzor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body,html{height:100%;font-family:'Inter',sans-serif;background:#000;color:#fff;overflow:hidden}
        .bg-video{position:fixed;top:50%;left:50%;min-width:100%;min-height:100%;width:auto;height:auto;transform:translate(-50%,-50%);z-index:0;filter:brightness(0.28) saturate(0.6);object-fit:cover;opacity:0;transition:opacity 1.8s ease}
        .bg-video.show{opacity:1}

        /* SOUND BTN */
        #sound-btn{position:fixed;top:18px;right:18px;z-index:200;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);display:none;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background 0.2s,transform 0.2s;color:rgba(255,255,255,0.7)}
        #sound-btn:hover{background:rgba(255,255,255,0.13);color:#fff;transform:scale(1.08)}
        #sound-btn svg{width:17px;height:17px;position:absolute}
        #sound-btn.show{display:flex}

        /* ENTER */
        #enter-screen{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity 1s ease}
        #typewriter{font-size:clamp(16px,3.5vw,24px);font-weight:300;color:rgba(255,255,255,0.65);letter-spacing:0.04em}
        #cursor{display:inline-block;width:2px;height:1em;background:rgba(255,255,255,0.65);margin-left:3px;vertical-align:middle;animation:blink 1s step-end infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

        /* MAIN */
        #main-content{position:relative;z-index:10;height:100%;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.9s ease}
        #main-content.visible{opacity:1;pointer-events:all}

        /* CARD */
        .card{width:min(380px,92vw);background:rgba(15,15,15,0.88);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,0.07);box-shadow:0 30px 80px rgba(0,0,0,0.7);transform:translateY(40px) scale(0.97);transition:transform 1s cubic-bezier(0.16,1,0.3,1),opacity 1s ease;opacity:0}
        #main-content.visible .card{transform:translateY(0) scale(1);opacity:1}
        .banner{width:100%;height:100px;background:#e8e8e8}

        /* AVATAR */
        .avatar-zone{position:relative;padding:0 20px;margin-top:-44px;margin-bottom:10px;display:flex;align-items:flex-end;justify-content:space-between}
        .avatar-decoration{position:relative;width:88px;height:88px;flex-shrink:0}
        .avatar-decoration::before{content:'';position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(rgba(255,255,255,0.95) 0%,rgba(210,225,255,0.55) 18%,rgba(255,255,255,0.98) 36%,rgba(195,215,250,0.5) 52%,rgba(255,255,255,0.95) 68%,rgba(215,228,255,0.6) 84%,rgba(255,255,255,0.95) 100%);animation:spinCloud 5s linear infinite;z-index:1}
        .avatar-decoration::after{content:'';position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(230,240,255,0.22) 0%,rgba(255,255,255,0.06) 50%,transparent 70%);animation:pulseCloud 3s ease-in-out infinite alternate;z-index:0}
        @keyframes spinCloud{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        @keyframes pulseCloud{from{opacity:0.5;transform:scale(1)}to{opacity:1;transform:scale(1.12)}}
        .avatar-bg{position:absolute;inset:2px;border-radius:50%;background:rgba(15,15,15,0.95);z-index:2}
        .avatar-bg img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
        .status-dot-avatar{position:absolute;bottom:4px;right:4px;width:14px;height:14px;border-radius:50%;border:3px solid rgba(15,15,15,0.95);background:#747f8d;z-index:3}
        .status-dot-avatar.online{background:#3ba55d}.status-dot-avatar.idle{background:#faa61a}.status-dot-avatar.dnd{background:#ed4245}.status-dot-avatar.offline{background:#747f8d}
        .status-badge{display:flex;align-items:center;gap:6px;padding:5px 12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:20px;margin-bottom:6px;font-size:12px;font-weight:500}
        .status-dot-badge{width:8px;height:8px;border-radius:50%;background:#747f8d;flex-shrink:0}
        .status-dot-badge.online{background:#3ba55d}.status-dot-badge.idle{background:#faa61a}.status-dot-badge.dnd{background:#ed4245}.status-dot-badge.offline{background:#747f8d}

        /* BODY */
        .card-body{padding:0 20px 18px}
        .username{font-size:21px;font-weight:700;letter-spacing:-0.02em;line-height:1.1}
        .handle{font-size:13px;color:rgba(255,255,255,0.35);margin-top:2px}
        .member-since{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:6px;padding:3px 8px}
        .member-since svg{width:11px;height:11px;opacity:0.5;flex-shrink:0}
        .activity{margin-top:12px;padding:9px 13px;background:rgba(255,255,255,0.04);border-radius:10px;border:1px solid rgba(255,255,255,0.06);font-size:12px;color:rgba(255,255,255,0.5);font-style:italic;display:flex;align-items:center;gap:8px}
        .activity.hidden{display:none}

        /* SPOTIFY */
        .spotify-row{margin-top:8px;padding:10px 13px;background:rgba(30,215,96,0.06);border:1px solid rgba(30,215,96,0.15);border-radius:12px;display:flex;align-items:center;gap:12px}
        .spotify-row.hidden{display:none}
        .spotify-art{width:46px;height:46px;border-radius:8px;flex-shrink:0;background:rgba(255,255,255,0.06);overflow:hidden;display:flex;align-items:center;justify-content:center}
        .spotify-art img{width:100%;height:100%;object-fit:cover;display:block;border-radius:8px}
        .spotify-text{overflow:hidden;flex:1}
        .spotify-label{font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:rgba(30,215,96,0.8);margin-bottom:3px;font-weight:600}
        .spotify-song{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
        .spotify-artist{font-size:11px;color:rgba(255,255,255,0.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
        .spotify-bars{display:flex;align-items:flex-end;gap:2px;height:16px;flex-shrink:0}
        .spotify-bars span{width:3px;border-radius:2px;background:#1ed760;opacity:0.8;animation:barBounce 1s ease-in-out infinite}
        .spotify-bars span:nth-child(1){height:8px;animation-delay:0s}
        .spotify-bars span:nth-child(2){height:14px;animation-delay:0.2s}
        .spotify-bars span:nth-child(3){height:6px;animation-delay:0.4s}
        .spotify-bars span:nth-child(4){height:12px;animation-delay:0.1s}
        @keyframes barBounce{0%,100%{transform:scaleY(0.4)}50%{transform:scaleY(1)}}

        .divider{height:1px;background:rgba(255,255,255,0.06);margin:14px 0}
        .socials{display:flex;justify-content:center;gap:14px}
        .social-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;text-decoration:none;color:rgba(255,255,255,0.6);transition:background 0.2s,color 0.2s,border-color 0.2s,transform 0.2s}
        .social-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);color:#fff;transform:translateY(-2px)}
        .social-btn svg{width:19px;height:19px}
    </style>
</head>

    <script>
        const DISCORD_ID='172383880677031938',TEXT='click to dive into my world';
        const enterScreen=document.getElementById('enter-screen'),mainContent=document.getElementById('main-content');
        const bgVideo=document.getElementById('bg-video'),bgMusic=document.getElementById('bg-music');
        const soundBtn=document.getElementById('sound-btn'),iconOn=document.getElementById('icon-on'),iconOff=document.getElementById('icon-off');
        let muted=false;

        function toggleSound(){muted=!muted;bgMusic.muted=muted;iconOn.style.display=muted?'none':'block';iconOff.style.display=muted?'block':'none';}

        const typeEl=document.getElementById('typewriter');let i=0;
        function type(){if(i<TEXT.length){typeEl.textContent+=TEXT[i++];setTimeout(type,60+Math.random()*45);}}
        setTimeout(type,800);

        enterScreen.addEventListener('click',()=>{
            enterScreen.style.opacity='0';enterScreen.style.pointerEvents='none';
            bgVideo.play();bgMusic.volume=0.45;bgMusic.play().catch(()=>{});
            setTimeout(()=>{bgVideo.classList.add('show');},200);
            setTimeout(()=>{enterScreen.style.display='none';mainContent.classList.add('visible');soundBtn.classList.add('show');},900);
        });

        async function fetchDiscord(){
            try{
                const res=await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const json=await res.json();if(!json.success)return;
                const d=json.data,u=d.discord_user;
                const hash=u.avatar,ext=hash?.startsWith('a_')?'gif':'png';
                document.getElementById('avatar-img').src=hash?`https://cdn.discordapp.com/avatars/${u.id}/${hash}.${ext}?size=128`:`https://cdn.discordapp.com/embed/avatars/${(parseInt(u.id)>>22)%6}.png`;
                const status=d.discord_status||'offline';
                document.getElementById('status-dot-avatar').className=`status-dot-avatar ${status}`;
                document.getElementById('status-dot-badge').className=`status-dot-badge ${status}`;
                const labels={online:'Online',idle:'Idle',dnd:'Do not disturb',offline:'Offline'};
                document.getElementById('status-text').textContent=labels[status];
                const activities=d.activities||[];
                const custom=activities.find(a=>a.type===4),other=activities.find(a=>a.type!==4&&a.type!==2);
                const actRow=document.getElementById('activity-row');
                if(custom?.state){document.getElementById('activity-icon').textContent='💬';document.getElementById('activity-text').textContent=custom.state;actRow.classList.remove('hidden');}
                else if(other){const icons={0:'🎮',1:'📡',3:'📺'};document.getElementById('activity-icon').textContent=icons[other.type]||'▶';document.getElementById('activity-text').textContent=other.name;actRow.classList.remove('hidden');}
                else{actRow.classList.add('hidden');}
                const spRow=document.getElementById('spotify-row');
                if(d.spotify?.song){
                    document.getElementById('spotify-song').textContent=d.spotify.song;
                    document.getElementById('spotify-artist').textContent=d.spotify.artist;
                    const artEl=document.getElementById('spotify-art');
                    artEl.innerHTML=d.spotify.album_art_url?`<img src="${d.spotify.album_art_url}" alt="cover">`:'';
                    spRow.classList.remove('hidden');
                }else{spRow.classList.add('hidden');}
            }catch(e){}
        }
        fetchDiscord();setInterval(fetchDiscord,20000);
    </script>
</body>
